<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <radialGradient id="potGrad" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f09766"/>
      <stop offset="60%" stop-color="#c95a28"/>
      <stop offset="100%" stop-color="#8a3010"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#de7443"/>
      <stop offset="50%" stop-color="#f3a479"/>
      <stop offset="100%" stop-color="#a43d15"/>
    </linearGradient>
    <radialGradient id="flowerRed" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="70%" stop-color="#d61a3c"/>
      <stop offset="100%" stop-color="#800a1d"/>
    </radialGradient>
    <radialGradient id="flowerPink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="80%" stop-color="#e83058"/>
      <stop offset="100%" stop-color="#990b29"/>
    </radialGradient>
    <radialGradient id="leafGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#69c354"/>
      <stop offset="70%" stop-color="#2d7c22"/>
      <stop offset="100%" stop-color="#14460d"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-opacity="0.38" flood-color="#0e1710"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Shadow under base -->
    <ellipse cx="100" cy="225" rx="55" ry="12" fill="rgba(20,30,20,0.35)"/>

    <!-- Pot Body -->
    <path d="M 50 145 L 62 215 C 63 220 72 224 100 224 C 128 224 137 220 138 215 L 150 145 Z" fill="url(#potGrad)"/>
    <!-- Pot Rim -->
    <ellipse cx="100" cy="145" rx="54" ry="14" fill="url(#rimGrad)"/>
    <!-- Pot Soil -->
    <ellipse cx="100" cy="144" rx="46" ry="10" fill="#3a2213"/>

    <!-- Lush Foliage Leaves -->
    <g fill="url(#leafGrad)">
      <circle cx="75" cy="130" r="18" opacity="0.95"/>
      <circle cx="125" cy="130" r="18" opacity="0.95"/>
      <circle cx="55" cy="115" r="22"/>
      <circle cx="145" cy="115" r="22"/>
      <circle cx="80" cy="100" r="24"/>
      <circle cx="120" cy="100" r="24"/>
      <circle cx="100" cy="88" r="26"/>
      <circle cx="65" cy="85" r="20"/>
      <circle cx="135" cy="85" r="20"/>
    </g>

    <!-- Geranium Flower Cluster 1 (Left) -->
    <g transform="translate(62, 75)">
      <circle cx="-10" cy="-6" r="11" fill="url(#flowerRed)"/>
      <circle cx="8" cy="-8" r="12" fill="url(#flowerPink)"/>
      <circle cx="-12" cy="8" r="10" fill="url(#flowerRed)"/>
      <circle cx="10" cy="8" r="11" fill="url(#flowerPink)"/>
      <circle cx="0" cy="0" r="13" fill="url(#flowerRed)"/>
      <circle cx="0" cy="0" r="4" fill="#ffe066"/>
    </g>

    <!-- Geranium Flower Cluster 2 (Right) -->
    <g transform="translate(138, 75)">
      <circle cx="-10" cy="-6" r="12" fill="url(#flowerPink)"/>
      <circle cx="8" cy="-8" r="11" fill="url(#flowerRed)"/>
      <circle cx="-10" cy="8" r="11" fill="url(#flowerRed)"/>
      <circle cx="10" cy="8" r="12" fill="url(#flowerPink)"/>
      <circle cx="0" cy="0" r="13" fill="url(#flowerRed)"/>
      <circle cx="0" cy="0" r="4" fill="#ffe066"/>
    </g>

    <!-- Geranium Flower Cluster 3 (Center Top - Prominent) -->
    <g transform="translate(100, 52)">
      <circle cx="-12" cy="-8" r="13" fill="url(#flowerRed)"/>
      <circle cx="12" cy="-8" r="14" fill="url(#flowerPink)"/>
      <circle cx="-12" cy="10" r="12" fill="url(#flowerPink)"/>
      <circle cx="12" cy="10" r="13" fill="url(#flowerRed)"/>
      <circle cx="0" cy="-14" r="11" fill="url(#flowerRed)"/>
      <circle cx="0" cy="2" r="15" fill="url(#flowerRed)"/>
      <circle cx="0" cy="2" r="4.5" fill="#fff176"/>
    </g>

    <!-- Subtle Bud Accent -->
    <circle cx="40" cy="105" r="6" fill="url(#flowerPink)"/>
    <circle cx="160" cy="105" r="6" fill="url(#flowerRed)"/>
    <circle cx="100" cy="28" r="7" fill="url(#flowerPink)"/>

    <!-- Pot Swiss Cross Motif (Emblem) -->
    <g transform="translate(100, 182)">
      <circle cx="0" cy="0" r="14" fill="rgba(255,255,255,0.2)"/>
      <rect x="-8" y="-3" width="16" height="6" rx="1.5" fill="#ffffff" opacity="0.9"/>
      <rect x="-3" y="-8" width="6" height="16" rx="1.5" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
