<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Peasant Girl Test</title>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#1e293b');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.3, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.4);
    hemi.position.set(0, 20, 0);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xfffbeb, 1.6);
    dir.position.set(3, 8, 5);
    dir.castShadow = true;
    scene.add(dir);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5, 32),
      new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const loader = new GLTFLoader();
    let mixer;

    loader.load('/assets/characters/Peasant_Girl.glb', (gltf) => {
      const model = gltf.scene;
      model.position.set(0, 0, 0);
      model.scale.setScalar(0.95);
      // Let's see orientation
      model.rotation.y = 0;

      model.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(model);

      // Now load animations from humanoid.glb
      loader.load('/assets/characters/humanoid.glb', (animGltf) => {
        mixer = new THREE.AnimationMixer(model);

        // Find initial hips height of Peasant_Girl
        let initialHipsY = 0;
        model.traverse(node => {
          if (node.name.includes('Hips')) {
            initialHipsY = node.position.y;
          }
        });
        console.log('Peasant Girl Initial Hips Y:', initialHipsY);

        const walkClip = animGltf.animations.find(a => a.name === 'Walk');
        if (walkClip) {
          const retargetedClip = walkClip.clone();
          // Filter out ALL non-hips position tracks!
          retargetedClip.tracks = retargetedClip.tracks.filter(track => {
            if (track.name.endsWith('.position')) {
              // Only keep hips position track, but adjust to match peasant girl's hips
              return track.name.includes('Hips');
            }
            return true;
          });

          // Scale hips translation
          for (const track of retargetedClip.tracks) {
            if (track.name.endsWith('.position') && track.name.includes('Hips')) {
              for (let i = 0; i < track.values.length; i += 3) {
                // X, Y, Z
                track.values[i] *= 0.01;     // cm to m
                track.values[i + 1] *= 0.01; // cm to m
                track.values[i + 2] *= 0.01; // cm to m
              }
            }
          }

          const action = mixer.clipAction(retargetedClip);
          action.play();
        }
      });
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
