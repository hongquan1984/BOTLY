<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chibi Animations Test</title>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0f172a');

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.2, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.4);
    hemi.position.set(0, 20, 0);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xfffbeb, 1.6);
    dir.position.set(3, 8, 5);
    dir.castShadow = true;
    scene.add(dir);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5, 32),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const loader = new GLTFLoader();
    let mixer;

    loader.load('/assets/characters/Platformer_Character.glb', (gltf) => {
      const m = gltf.scene;
      m.position.set(0, 0, 0);
      m.scale.setScalar(0.9);
      
      // Let's check materials: Can style tunic with lovely emerald/sage green or forest explorer!
      m.traverse(c => {
        if (c.isMesh) {
          c.castShadow = true;
          if (c.material.name === 'Main') {
            // Give it a fresh emerald adventurer tunic color
            c.material.color.set('#059669'); // Emerald
          } else if (c.material.name === 'Main2') {
            c.material.color.set('#10b981'); // Light Emerald
          } else if (c.material.name === 'Main_Light') {
            c.material.color.set('#fed7aa'); // Soft warm skin/face
          }
        }
      });
      scene.add(m);

      console.log('Available clips:', gltf.animations.map(a => a.name));
      mixer = new THREE.AnimationMixer(m);
      const walkClip = gltf.animations.find(a => a.name.includes('Walk'));
      if (walkClip) {
        mixer.clipAction(walkClip).play();
      }
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
