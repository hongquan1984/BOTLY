<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HealthClues · Đang vào Hành trình của bạn...</title>
  <style>
    body {
      background: radial-gradient(circle at 50% 40%, #16382b 0%, #0d231a 100%);
      color: #ffd868;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: rgba(18, 44, 32, 0.95);
      border: 2px solid #508764;
      border-radius: 1.5rem;
      padding: 2rem 2.5rem;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      max-width: 440px;
    }
    h2 { margin: 0 0 0.5rem; font-size: 1.35rem; color: #fff8db; }
    p { margin: 0; color: #d4e8da; font-size: 0.9rem; line-height: 1.5; }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 1.25rem auto;
      border: 3.5px solid rgba(223, 201, 130, 0.25);
      border-top-color: #f5c84c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>🌿 Đang vào Thung lũng Giấc ngủ</h2>
    <p>Đang chuẩn bị phiên đăng nhập &amp; Bản đồ Hành trình 30 ngày của bạn...</p>
  </div>
  <script>
    async function activateAndEnter() {
      try {
        const res = await fetch('/api/healthclues/account/quick-activate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: 'hongquan0508@gmail.com' })
        });
        const data = await res.json();
        if (data.ok && data.session) {
          localStorage.setItem('botly-cloud-session', JSON.stringify(data.session));
          localStorage.setItem('healthclues-player-locale-v1', 'vi');
          if (data.session.user && data.session.user.id) {
            localStorage.setItem('healthclues-player-locale-owner-v1', data.session.user.id);
            localStorage.setItem('healthclues-player-locale-v1:' + data.session.user.id, 'vi');
          }
          document.cookie = 'hc_locale=vi; Path=/; Max-Age=2592000';
          window.location.replace('/vi/wellness/healthclues/world#hc-journey');
          return;
        }
      } catch (err) {
        console.warn('Quick-activate API fetch failed, falling back:', err);
      }
      window.location.replace('/api/healthclues/account/quick-activate?email=hongquan0508@gmail.com');
    }
    activateAndEnter();
  </script>
</body>
</html>
