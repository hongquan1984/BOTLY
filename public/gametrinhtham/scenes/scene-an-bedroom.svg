<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1f0d02"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#eab308" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0"/>
    </radialGradient>
    <filter id="cozyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect x="0" y="0" width="1200" height="560" fill="url(#wallGrad)"/>

  <!-- Wooden Floor -->
  <rect x="0" y="560" width="1200" height="240" fill="url(#floorGrad)"/>

  <!-- Floor Planks Pattern -->
  <line x1="0" y1="620" x2="1200" y2="620" stroke="#2c1404" stroke-width="2"/>
  <line x1="0" y1="680" x2="1200" y2="680" stroke="#2c1404" stroke-width="2"/>
  <line x1="0" y1="740" x2="1200" y2="740" stroke="#2c1404" stroke-width="2"/>

  <!-- Window with Curtains (Streetlight coming in) -->
  <g transform="translate(900, 100)" filter="url(#cozyShadow)">
    <rect x="0" y="0" width="220" height="320" rx="10" fill="#0369a1" stroke="#38bdf8" stroke-width="4"/>
    <!-- Glass panes -->
    <rect x="15" y="15" width="90" height="135" fill="#0284c7" opacity="0.8"/>
    <rect x="115" y="15" width="90" height="135" fill="#0284c7" opacity="0.8"/>
    <rect x="15" y="160" width="90" height="145" fill="#0284c7" opacity="0.8"/>
    <rect x="115" y="160" width="90" height="145" fill="#0284c7" opacity="0.8"/>
    <!-- Crescent Moon outside -->
    <path d="M140 40 A 20 20 0 0 0 170 70 A 25 25 0 0 1 140 40 Z" fill="#fef08a" opacity="0.9"/>
    <!-- Street light beam -->
    <polygon points="0,320 220,320 -300,700 400,700" fill="url(#windowLight)"/>
    <!-- Curtains parted -->
    <path d="M0,0 Q30,160 0,320 L-20,320 L-20,0 Z" fill="#475569"/>
    <path d="M220,0 Q190,160 220,320 L240,320 L240,0 Z" fill="#475569"/>
  </g>

  <!-- Bookshelf & Fern Plant on the left -->
  <g transform="translate(100, 200)" filter="url(#cozyShadow)">
    <rect x="0" y="0" width="140" height="360" rx="6" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <!-- Shelves -->
    <rect x="10" y="80" width="120" height="8" fill="#451a03"/>
    <rect x="10" y="180" width="120" height="8" fill="#451a03"/>
    <rect x="10" y="270" width="120" height="8" fill="#451a03"/>
    <!-- Books -->
    <rect x="15" y="100" width="18" height="75" fill="#dc2626" rx="2"/>
    <rect x="35" y="90" width="22" height="85" fill="#2563eb" rx="2"/>
    <rect x="60" y="110" width="15" height="65" fill="#16a34a" rx="2"/>
    <rect x="78" y="95" width="20" height="80" fill="#d97706" rx="2"/>
    <!-- Top shelf: Fern Plant (Decor Hotspot) -->
    <circle cx="70" cy="35" r="40" fill="none"/>
    <path d="M50 70 L90 70 L80 80 L60 80 Z" fill="#d97706"/> <!-- Pot -->
    <!-- Fern leaves -->
    <path d="M70,70 Q50,30 30,20 Q60,40 70,70 Z" fill="#10b981"/>
    <path d="M70,70 Q70,20 70,10 Q75,30 70,70 Z" fill="#059669"/>
    <path d="M70,70 Q90,30 110,25 Q85,45 70,70 Z" fill="#34d399"/>
  </g>

  <!-- Work Desk with Coffee Cup -->
  <g transform="translate(260, 360)" filter="url(#cozyShadow)">
    <!-- Desk table top -->
    <rect x="0" y="100" width="280" height="24" rx="4" fill="#92400e" stroke="#78350f" stroke-width="2"/>
    <!-- Desk legs -->
    <rect x="20" y="124" width="16" height="180" fill="#78350f"/>
    <rect x="244" y="124" width="16" height="180" fill="#78350f"/>
    <!-- Laptop closed -->
    <rect x="100" y="90" width="100" height="10" rx="3" fill="#647469"/>
    <!-- Table Lamp -->
    <g transform="translate(30, 20)">
      <circle cx="20" cy="20" r="50" fill="url(#lampGlow)"/>
      <path d="M5,40 L35,40 L30,20 L10,20 Z" fill="#facc15"/>
      <line x1="20" y1="40" x2="20" y2="80" stroke="#475569" stroke-width="4"/>
      <rect x="10" y="80" width="20" height="6" fill="#334155"/>
    </g>
    <!-- Coffee Cup (Hotspot Target!) -->
    <g transform="translate(180, 50)">
      <!-- Steaming vapor hint -->
      <path d="M15,10 Q12,-5 18,-15" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M22,12 Q26,0 20,-10" stroke="#94a3b8" stroke-width="2" fill="none" opacity="0.6"/>
      <!-- Glass Cup -->
      <rect x="5" y="15" width="28" height="36" rx="4" fill="#334155" opacity="0.9" stroke="#94a3b8" stroke-width="1.5"/>
      <!-- Dark Coffee liquid inside -->
      <rect x="7" y="24" width="24" height="25" rx="3" fill="#451a03"/>
      <!-- Cup Handle -->
      <path d="M33,22 Q42,28 33,36" stroke="#94a3b8" stroke-width="2.5" fill="none"/>
    </g>
  </g>

  <!-- Big Cozy Bed with Pillow, Phone, and Sleep Journal -->
  <g transform="translate(600, 380)" filter="url(#cozyShadow)">
    <!-- Wooden Headboard -->
    <rect x="20" y="0" width="460" height="140" rx="8" fill="#78350f" stroke="#451a03" stroke-width="4"/>
    <rect x="40" y="20" width="420" height="100" rx="4" fill="#92400e"/>
    <!-- Mattress & Bed Sheet -->
    <rect x="40" y="100" width="440" height="180" rx="10" fill="url(#bedGrad)"/>
    <!-- Quilt fold -->
    <path d="M40,150 Q260,180 480,150 L480,280 L40,280 Z" fill="#065f46" stroke="#047857" stroke-width="2"/>
    <!-- Fluffy Pillows -->
    <rect x="80" y="70" width="120" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="240" y="70" width="120" height="60" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Smartphone on bed (Hotspot Target!) -->
    <g transform="translate(200, 140)">
      <!-- Blue screen glow -->
      <circle cx="20" cy="30" r="35" fill="#38bdf8" opacity="0.25"/>
      <!-- Phone body -->
      <rect x="5" y="5" width="30" height="52" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="7" y="9" width="26" height="44" rx="3" fill="#0284c7" opacity="0.9"/>
      <!-- Screen UI lines -->
      <line x1="10" y1="18" x2="28" y2="18" stroke="#ffffff" stroke-width="2"/>
      <line x1="10" y1="26" x2="24" y2="26" stroke="#bae6fd" stroke-width="1.5"/>
      <line x1="10" y1="34" x2="26" y2="34" stroke="#bae6fd" stroke-width="1.5"/>
    </g>

    <!-- Sleep Journal book (Hotspot Target!) -->
    <g transform="translate(60, 160)">
      <rect x="0" y="0" width="50" height="65" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2"/>
      <!-- Open pages effect -->
      <rect x="4" y="4" width="42" height="57" rx="2" fill="#fef3c7"/>
      <line x1="8" y1="15" x2="42" y2="15" stroke="#92400e" stroke-width="1.5"/>
      <line x1="8" y1="24" x2="38" y2="24" stroke="#92400e" stroke-width="1.5"/>
      <line x1="8" y1="33" x2="40" y2="33" stroke="#92400e" stroke-width="1.5"/>
      <line x1="8" y1="42" x2="32" y2="42" stroke="#92400e" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Detective Mystery Vignette Overlay -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#0f172a" stroke-width="16" opacity="0.8"/>
</svg>
