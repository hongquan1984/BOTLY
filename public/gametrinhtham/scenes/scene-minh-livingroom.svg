<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="minhWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="minhFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b1d11"/>
      <stop offset="100%" stop-color="#190a05"/>
    </linearGradient>
    <radialGradient id="minhChandelier" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <filter id="sceneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect x="0" y="0" width="1200" height="520" fill="url(#minhWall)"/>

  <!-- Warm Wooden Floor -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#minhFloor)"/>
  <line x1="0" y1="580" x2="1200" y2="580" stroke="#261007" stroke-width="2"/>
  <line x1="0" y1="650" x2="1200" y2="650" stroke="#261007" stroke-width="2"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#261007" stroke-width="2"/>

  <!-- Overhead Chandelier Glow -->
  <circle cx="600" cy="200" r="280" fill="url(#minhChandelier)"/>
  <line x1="600" y1="0" x2="600" y2="120" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="600" cy="120" rx="40" ry="12" fill="#d97706"/>
  <polygon points="560,120 640,120 615,150 585,150" fill="#fef08a" opacity="0.9"/>

  <!-- Left: Bookshelf with Python Books (Decor Hotspot) -->
  <g transform="translate(80, 160)" filter="url(#sceneShadow)">
    <rect x="0" y="0" width="130" height="380" rx="6" fill="#581c87" stroke="#3b0764" stroke-width="4"/>
    <rect x="10" y="90" width="110" height="8" fill="#3b0764"/>
    <rect x="10" y="190" width="110" height="8" fill="#3b0764"/>
    <rect x="10" y="280" width="110" height="8" fill="#3b0764"/>
    <!-- Technical Books -->
    <rect x="15" y="110" width="22" height="75" fill="#3b82f6" rx="2"/>
    <rect x="40" y="105" width="26" height="80" fill="#10b981" rx="2"/>
    <rect x="70" y="120" width="20" height="65" fill="#f59e0b" rx="2"/>
    <rect x="18" y="210" width="24" height="65" fill="#ec4899" rx="2"/>
    <rect x="46" y="205" width="28" height="70" fill="#06b6d4" rx="2"/>
    <rect x="78" y="200" width="22" height="75" fill="#84cc16" rx="2"/>
  </g>

  <!-- Medicine Cabinet on the right wall (Allopurinol Hotspot Target!) -->
  <g transform="translate(940, 180)" filter="url(#sceneShadow)">
    <rect x="0" y="0" width="150" height="190" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="4"/>
    <!-- Red Cross Symbol -->
    <rect x="65" y="18" width="20" height="6" fill="#ef4444" rx="2"/>
    <rect x="72" y="11" width="6" height="20" fill="#ef4444" rx="2"/>
    <!-- Glass Shelves -->
    <rect x="10" y="50" width="130" height="6" fill="#cbd5e1"/>
    <rect x="10" y="115" width="130" height="6" fill="#cbd5e1"/>
    <!-- Pill Bottle (Allopurinol) -->
    <g transform="translate(45, 60)">
      <rect x="0" y="10" width="30" height="42" rx="4" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
      <rect x="4" y="2" width="22" height="10" rx="2" fill="#ef4444"/>
      <!-- Label -->
      <rect x="3" y="18" width="24" height="22" fill="#fee2e2"/>
      <text x="5" y="32" font-family="sans-serif" font-size="8" font-weight="bold" fill="#991b1b">ALLO</text>
    </g>
    <!-- Vitamin Bottle -->
    <g transform="translate(90, 70)">
      <rect x="0" y="8" width="24" height="34" rx="3" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
      <rect x="3" y="2" width="18" height="8" rx="2" fill="#c2410c"/>
    </g>
  </g>

  <!-- Dining & Work Table (Center) -->
  <g transform="translate(260, 360)" filter="url(#sceneShadow)">
    <!-- Wooden Tabletop -->
    <rect x="0" y="60" width="560" height="32" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- Table Legs -->
    <rect x="30" y="92" width="24" height="220" fill="#451a03"/>
    <rect x="506" y="92" width="24" height="220" fill="#451a03"/>

    <!-- Left side of table: Smartphone with Beef Photo (Hotspot Target!) -->
    <g transform="translate(40, -10)">
      <rect x="0" y="0" width="60" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <!-- Screen with Steak Photo inside -->
      <rect x="4" y="6" width="52" height="88" rx="5" fill="#78350f"/>
      <!-- Steak Illustration inside screen -->
      <ellipse cx="30" cy="45" rx="18" ry="12" fill="#b91c1c" stroke="#450a0a" stroke-width="2"/>
      <line x1="20" y1="42" x2="40" y2="42" stroke="#fca5a5" stroke-width="2"/>
      <line x1="22" y1="48" x2="38" y2="48" stroke="#fca5a5" stroke-width="2"/>
      <!-- Timestamp badge on screen "19/10" -->
      <rect x="6" y="70" width="48" height="18" rx="3" fill="#0f172a" opacity="0.85"/>
      <text x="10" y="82" font-family="sans-serif" font-size="7" font-weight="bold" fill="#fef08a">19/10/2026</text>
    </g>

    <!-- Lab Result Paper (Hotspot Target!) -->
    <g transform="translate(180, 20)">
      <rect x="0" y="0" width="80" height="50" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" transform="rotate(-5)"/>
      <text x="8" y="16" font-family="sans-serif" font-size="7" font-weight="bold" fill="#0f172a">XÉT NGHIỆM MÁU</text>
      <text x="8" y="28" font-family="sans-serif" font-size="6" fill="#dc2626">Acid Uric: 515 µmol/L</text>
      <line x1="8" y1="36" x2="65" y2="36" stroke="#94a3b8" stroke-width="1"/>
    </g>

    <!-- Center: Water Bottle 500ml (Hotspot Target!) -->
    <g transform="translate(320, -15)">
      <rect x="0" y="10" width="28" height="75" rx="6" fill="#38bdf8" opacity="0.5" stroke="#0284c7" stroke-width="2"/>
      <rect x="6" y="2" width="16" height="10" rx="2" fill="#0369a1"/>
      <!-- Low water level (only 10% full!) -->
      <rect x="2" y="65" width="24" height="18" rx="3" fill="#0284c7" opacity="0.8"/>
      <line x1="4" y1="65" x2="24" y2="65" stroke="#bae6fd" stroke-width="2"/>
    </g>

    <!-- Right side: Chair with Coat & Dinner Receipt (Hotspot Target!) -->
    <g transform="translate(420, -30)">
      <!-- Chair Backrest -->
      <rect x="20" y="10" width="80" height="110" rx="6" fill="#92400e" stroke="#78350f" stroke-width="3"/>
      <!-- Jacket draped on chair -->
      <path d="M10,30 Q60,10 110,30 L115,120 L5,120 Z" fill="#1e293b"/>
      <!-- Pocket with folded receipt sticking out -->
      <rect x="35" y="70" width="35" height="40" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
      <text x="38" y="82" font-family="sans-serif" font-size="6" font-weight="bold" fill="#78350f">HÓA ĐƠN</text>
      <text x="38" y="90" font-family="sans-serif" font-size="5" fill="#b45309">Lẩu Ghẹ · 4 Bia</text>
      <text x="38" y="98" font-family="sans-serif" font-size="5" fill="#dc2626">21:15 tối qua</text>
    </g>
  </g>

  <!-- Ambient Vignette -->
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#090d16" stroke-width="16" opacity="0.8"/>
</svg>
